{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nasa-etl.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nasa-etl.labels" . | nindent 4 }}
type: Opaque
data:
      database-password: {{ "CHANGE_ME_VERTICA_PASSWORD" | b64enc }}
  nasa-api-key: {{ .Values.nasaApiKey | b64enc }}
{{- end }}
