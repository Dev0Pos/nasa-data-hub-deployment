# NASA Data Hub - Main Configuration
# This chart deploys a complete data analytics platform for NASA EONET data

# Global configuration
global:
  environment: production
  namespaceOverride: ""
  initPolicy: "Create"  # VerticaDB initialization policy: "Create" or "Revive"

# MinIO Configuration
minio:
  enabled: true
  auth:
    rootUser: "admin"
    rootPassword: "CHANGE_ME_MINIO_PASSWORD"
  persistence:
    enabled: true
    size: "100Gi"
    storageClass: "local-storage"
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    limits:
      memory: 2Gi
      cpu: 1000m
    requests:
      memory: 1Gi
      cpu: 500m
  defaultBuckets: "nasa-data-hub-vertica"
  serviceAccount:
    create: true
    automountServiceAccountToken: true

# Vertica Operator Configuration
verticadb-operator:
  enabled: true
  image:
    repository: vertica/vertica-operator
    tag: "25.3.0-0"
    pullPolicy: Always
  webhook:
    enable: false
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 250m

# Vertica Configuration
verticadb:
  enabled: true
  replicaCount: 1
  image:
    repository: opentext/vertica-k8s
    tag: "25.3.0-0"
    pullPolicy: Always
  auth:
    password: "CHANGE_ME_VERTICA_PASSWORD"
  persistence:
    enabled: true
    size: "50Gi"
    storageClass: "local-storage"
  resources:
    limits:
      memory: 4Gi
      cpu: 2000m
    requests:
      memory: 2Gi
      cpu: 1000m
  service:
    type: ClusterIP
    port: 5433
  database:
    name: "nasa_data"
    user: "dbadmin"
    password: "CHANGE_ME_VERTICA_PASSWORD"

# Metabase Configuration
metabase:
  enabled: true
  image:
    repository: metabase/metabase
    tag: "v0.53.18"
    pullPolicy: Always
  replicaCount: 1
  resources:
    limits:
      memory: 2Gi
      cpu: 1000m
    requests:
      memory: 1Gi
      cpu: 500m
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: metabase.local
        paths:
          - path: /
            pathType: Prefix
  config:
    encryptionSecretKey: "CHANGE_ME_METABASE_SECRET_KEY"
    databaseType: "h2"
    databaseHost: ""
    databasePort: ""
    databaseName: ""
    databaseUser: ""
    databasePassword: ""
    # Vertica connection configuration
    verticaHost: "nasa-data-hub-verticadb-nasa-data-hub-verticadb"
    verticaPort: "5433"
    verticaDatabase: "nasa_data"
    verticaUser: "dbadmin"
    verticaPassword: "CHANGE_ME_VERTICA_PASSWORD"

# NASA ETL Go Application Configuration
nasa-etl:
  enabled: true
  nasaApiKey: "CHANGE_ME_NASA_API_KEY"  # REQUIRED: Set your NASA API key here
  nasaApiUrl: "https://eonet.gsfc.nasa.gov/api/v3"
  # CronJob configuration
  cronjob:
    enabled: true
    schedule: "0 * * * *"  # Co godzinę (cron format: minute hour day month weekday)
    concurrencyPolicy: "Forbid"  # Nie uruchamiaj nowego joba jeśli poprzedni jeszcze działa
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3

# Ingress Configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nasa-data-hub.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Preinstall Configuration
preinstall:
  directories:
    enabled: true
    basePath: "/tmp"
    permissions: "777"
  persistentVolumes:
    enabled: true
    minio:
      enabled: true
      name: "nasa-data-hub-minio-pv"
      size: "100Gi"
      path: "/tmp/nasa-data-hub-minio"
    vertica:
      enabled: true
      count: 1
      size: "50Gi"
      basePath: "/tmp/nasa-data-hub-vertica"
      baseName: "nasa-data-hub-vertica-pv"
    metabase:
      enabled: true
      name: "nasa-data-hub-metabase-data-pv"
      size: "10Gi"
      path: "/tmp/nasa-data-hub-metabase-data"
  storageClass:
    enabled: true
    name: "local-storage"
    isDefault: true
    provisioner: "kubernetes.io/no-provisioner"
    volumeBindingMode: "WaitForFirstConsumer"

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: "nasa-data-hub"

# Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000